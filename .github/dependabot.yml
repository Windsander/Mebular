version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      # minor/patch 合并为一个 PR；major 不匹配此分组，仍按依赖单独提 PR
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
