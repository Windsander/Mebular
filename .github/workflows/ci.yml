name: CI

on:
  push:
    branches-ignore:
      - 'site'
      - 'site-*'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage gates
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Cleanliness (orphan modules / stale refs / deprecated)
        run: npm run check:cleanliness

      - name: Surface parity (MCP tools ↔ CLI, unified tables, no orphans)
        run: npm run check:surface-parity

      - name: Docs consistency (EN/CN structure, links, tool names, no handwritten numbers)
        run: npm run check:docs

      - name: Dependency policy (THIRD-PARTY declaration + exact pin)
        run: npm run check:deps

      - name: Fleet acceptance (M2 local / M3 remote / M4 agents / Step 1b onboard)
        run: npm run verify:fleet:all > fleet-acceptance.log 2>&1 || { tail -n 200 fleet-acceptance.log; exit 1; }

      - name: Unified daemon (identity mode / app API / fail-closed / single-writer)
        run: npm run verify:daemon

      - name: Daemon cluster (two-machine loopback sync + delegated identity)
        run: npm run verify:daemon:cluster

      - name: Console E1 (static/CSRF/scope/config combo/TLS)
        run: npm run verify:console > console-e1.log 2>&1 || { tail -n 200 console-e1.log; exit 1; }

      - name: Console UI smoke (headless Chrome via CDP; SKIP if no browser)
        run: npm run verify:console:ui > console-ui.log 2>&1 || { tail -n 200 console-ui.log; exit 1; }

      - name: Pairing auto-connect (address book / relay degrade & recover)
        run: npm run verify:connect > verify-connect.log 2>&1 || { tail -n 200 verify-connect.log; exit 1; }

      - name: LAN discovery (deterministic fake-bonjour harness + best-effort real mDNS)
        run: npm run verify:lan > verify-lan.log 2>&1 || { tail -n 200 verify-lan.log; exit 1; }

      - name: Invite / QR / auto-grant (scan-to-connect acceptance)
        run: npm run verify:invite > verify-invite.log 2>&1 || { tail -n 200 verify-invite.log; exit 1; }

      - name: NAT hole punching (AutoNAT + DCUtR; deterministic + best-effort real)
        run: npm run verify:nat > verify-nat.log 2>&1 || { tail -n 200 verify-nat.log; exit 1; }

      - name: Upload failure logs (flaky acceptance triage)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failure-logs
          path: |
            fleet-acceptance.log
            console-e1.log
            console-ui.log
            verify-connect.log
            verify-lan.log
            verify-invite.log
            verify-nat.log
          retention-days: 14
          if-no-files-found: ignore

      - name: stdio MCP (real client)
        run: npm run verify:mcp:stdio

      - name: HTTP MCP (auth / PKCE / lock / fail-closed)
        run: npm run verify:mcp:http

      - name: OAuth hardening (no anonymous admin token)
        run: npm run verify:mcp:oauth

      - name: Skill package + CLI (init/keygen/print-config/status)
        run: npm run verify:mcp:skill

      - name: Publish (npm pack + tarball smoke, D41)
        run: npm run verify:mcp:publish

      - name: WAN two-node local fixture (default-deny authorization)
        run: npm run verify:wan:cross:selftest

      - name: WAN L2 relay-only simulation (libp2p circuit relay)
        run: npm run verify:wan:l2

      - name: MCP cross-node local fixture (default-deny authorization)
        run: npm run verify:mcp:cross:selftest

  wan-nat:
    name: WAN NAT isolation (docker compose, relay + 2 NAT peers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: WAN L2 NAT isolation (three containers; SKIP if docker unavailable)
        run: npm run verify:wan:l2:docker

  windows:
    name: windows build / test / lint (fleet local + onboard)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Windows 上不跑真 mDNS：mDNS 在多播受限的 runner 上不稳定，且 C3 的行为由 ubuntu 的
      # 确定式 harness（注入假 bonjour，`npm run verify:lan`）覆盖；此处只跑构建/单测/local/onboard。
      # Windows 上只跑 local + onboard：两者覆盖 spool 传输与真实 libp2p serve/work/doctor 全路径。
      # 跳过 remote / agents / grant 的显式原因：它们的 loopback 时延 p50/p95 断言与多次进程起停
      # 在共享 runner 上易抖动，且不新增平台覆盖面；这些套件由 ubuntu job 的 verify:fleet:all 覆盖。
      - name: Fleet local two-process (M2, spool)
        run: npm run verify:fleet:local

      - name: Console E1 (console static/API smoke on Windows)
        run: npm run verify:console > console-e1.log 2>&1 || { Get-Content console-e1.log -Tail 200; exit 1; }

      - name: Fleet onboard (Step 1b, libp2p + doctor; Windows 权限项 SKIP)
        run: npm run verify:fleet:onboard

      - name: Upload failure logs (windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-logs
          path: |
            console-e1.log
          retention-days: 14
          if-no-files-found: ignore

  semantic-real:
    name: semantic recall (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MEBULAR_EMBEDDING_REAL: '1'
      MEBULAR_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/transformers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install optional embedding package (real, not persisted)
        run: npm install --no-save @huggingface/transformers

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-paraphrase-multilingual-MiniLM-L12-v2-v1

      - name: Build
        run: npm run build

      - name: Real semantic verification (product path, exit 0)
        run: npm run verify:semantic:real

      - name: Real semantic lifecycle + distributed tests (node:test)
        run: node --test tests-semantic/real-semantic.test.mjs
