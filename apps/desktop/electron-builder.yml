# Mebular 桌面 App · 打包配置
#
# R1：安装包运行时来自发布 tarball（apps/desktop/runtime，由 prepare-runtime 安装），
# 不再复制仓库 dist / packages 源码。签名、公证、自动更新留给 R2/R6。
appId: com.mebular.desktop
productName: Mebular
copyright: Copyright © 2026 Sobert Li (Windsander)
# App 图标（与网页版 favicon 同源的 ✦ 星）：electron-builder 自动派生 icns/ico
icon: resources/icon.png
directories:
  output: dist
  buildResources: resources
files:
  - src/**/*
  - resources/**/*
  - package.json
  # 运行时依赖只走 extraResources/runtime；禁止 electron-builder 把仓库根的生产依赖
  # 再塞进 app.asar（apps/desktop 在 monorepo 内，默认会向上发现根 node_modules）。
  - '!**/node_modules/**'
extraResources:
  # 发布 tarball 安装出的完整运行时（@mebular/core + fleet/service/mcp/skill + 依赖）。
  # @mebular/core 包内自带 packages/console / locales / packages/mcp / fleet / service，
  # 因此 packaged 态不再单独复制这些仓库目录。
  - from: runtime/node_modules
    to: node_modules
asar: true
mac:
  target: [dmg]
  category: public.app-category.productivity
  artifactName: Mebular-${version}-${arch}.${ext}
  # R1 明确不签名（即使本机钥匙串里有 Apple Development 证书也不自动发现）；
  # R2 接入 CSC_LINK / APPLE_* 时移除此项并做条件签名。
  identity: null
win:
  target: [nsis]
  artifactName: Mebular-Setup-${version}.${ext}
linux:
  target: [AppImage, deb]
  category: Utility
  # .deb 要求维护者；显式声明与 package.json author.email 一致，避免依赖派生。
  maintainer: Sobert Li (Windsander) <Windsander@users.noreply.github.com>
  # package name 是 @mebular/desktop，默认 executableName 会派生为 @mebulardesktop；
  # AppImage 拒绝该字符集（只允许字母/数字/连字符/下划线/点/空格），故显式指定。
  executableName: mebular
  # .desktop 文件名对齐 package.json desktopName（Electron app_id / WM_CLASS）。
  syncDesktopName: true
  artifactName: Mebular-${version}-${arch}.${ext}
# R1 不做：签名/公证/发布/自动更新（R2/R6 处理）
publish: null
