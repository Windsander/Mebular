<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mebular App 图标（与网页版 favicon 同源：✦ 星）· 深底圆角 + 薄荷绿辉光 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <path filter="url(#glow)" fill="#6dffb8" d="M512 300 C 524 420, 560 456, 680 512 C 560 568, 524 604, 512 724 C 500 604, 464 568, 344 512 C 464 456, 500 420, 512 300 Z"/>
</svg>
