<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 安全：仅本地渲染；无内联脚本执行外部内容；CSP 限制为自身（渲染层零网络，全部走 preload 白名单） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>Mebular · 开始</title>
  <style>
    /* 风格一致性：复用控制台 :root/--crt-* token；系统字体栈 */
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --bg-panel: #0b1020;
      --bg-panel-2: #0e1428;
      --border: #1d2740;
      --text: #dbe4ff;
      --muted: #8391b4;
      --accent: #56b4e9;
      --accent-2: #e69f00;
      --ok: #009e73;
      --crt: #6dffb8;
      --crt-bright: #c8ffe3;
      --crt-dim: rgba(140, 255, 200, 0.52);
      --crt-border: rgba(80, 255, 170, 0.38);
      --crt-border-soft: rgba(80, 255, 170, 0.22);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font: 14px -apple-system, system-ui, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }
    /* 星野舞台（轻量 canvas；仅可见时渲染、隐藏即停；prefers-reduced-motion 静止） */
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    /* 三态布局：初始=全屏居中；部署/完成=标题上浮至顶部、内容自上而下 */
    .stage { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 52px 24px 96px; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
    body.is-idle .stage { justify-content: center; padding-top: 0; padding-bottom: 0; }
    body.is-idle .hero { margin-bottom: 26px; }
    .idle-cta { text-align: center; }

    /* ===== hero：品牌区（✦ / MEBULAR / 一句 tagline） ===== */
    .hero { text-align: center; margin-bottom: 34px; }
    /* 闪烁治理：品牌标静态辉光（不再呼吸） */
    .hero .mark { font-size: 30px; color: var(--crt); text-shadow: 0 0 18px rgba(109, 255, 184, 0.8); }
    .hero h1 { font-size: 28px; letter-spacing: 8px; margin: 8px 0 6px; color: var(--crt-bright); text-shadow: 0 0 24px rgba(109, 255, 184, 0.35); font-weight: 600; }
    .hero .tagline { color: var(--muted); font-size: 13px; letter-spacing: 2px; margin: 0; min-height: 18px; }
    .hero .badge { margin-top: 8px; display: inline-block; }

    /* ===== 部署舞台（单面板：完整居中） ===== */
    .panel { border: 1px solid var(--crt-border-soft); border-radius: 10px; padding: 16px 18px;
      background: linear-gradient(180deg, rgba(14, 20, 40, 0.88), rgba(8, 12, 24, 0.88));
      box-shadow: 0 0 0 1px rgba(80, 255, 170, 0.04), 0 18px 50px -30px rgba(0, 0, 0, 0.9), inset 0 0 40px -30px rgba(80, 255, 170, 0.25); }
    .step h2, #deploy-panel h2 { font-size: 15px; letter-spacing: 2px; margin: 0 0 6px; color: var(--crt-bright); display: flex; align-items: center; gap: 8px; }

    .muted { color: var(--muted); font-size: 12px; }
    .hint { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    pre { background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; max-height: 280px; white-space: pre-wrap; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--crt-border); color: var(--crt); }
    .badge.todo { border-color: #6b5a2c; color: #ffd479; }
    .badge.service { border-color: var(--crt-border-soft); color: var(--crt-dim); }

    button { background: rgba(8, 38, 26, 0.6); color: #a9ffd4; border: 1px solid var(--crt-border); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    button:hover:not(:disabled) { border-color: rgba(120, 255, 190, 0.6); background: rgba(12, 52, 36, 0.75); }
    button:disabled { opacity: 0.35; cursor: default; }
    button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
    button.primary { background: rgba(12, 52, 36, 0.85); border-color: var(--crt); color: var(--crt-bright); box-shadow: 0 0 14px -4px rgba(80, 255, 170, 0.5); }
    button.big { font-size: 15px; padding: 11px 26px; border-radius: 8px; letter-spacing: 1px; }
    button.small { padding: 4px 10px; font-size: 12px; }

    details { border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    details[open] summary { margin-bottom: 6px; }

    /* 流水（部署四步）：全自动叙事 */
    .flow { list-style: none; margin: 10px 0 4px; padding: 0; display: grid; gap: 4px; }
    .flow[hidden] { display: none; }
    .flow li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .flow > li > i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); flex: 0 0 auto; font-style: normal; text-align: center; line-height: 13px; font-size: 10px; }
    .flow li[data-state="done"] { color: var(--crt); }
    .flow li[data-state="done"] > i { border-color: var(--crt); background: rgba(109, 255, 184, 0.15); }
    .flow li[data-state="done"] > i::before { content: '✓'; }
    .flow li[data-state="active"] { color: var(--text); }
    .flow li[data-state="active"] > i { border-color: var(--crt); box-shadow: 0 0 6px rgba(109, 255, 184, 0.7); }
    .flow li[data-state="active"] > i::before { content: '●'; color: var(--crt-bright); }
    .flow li[data-state="failed"] { color: var(--accent-2); }
    .flow li[data-state="failed"] > i { border-color: var(--accent-2); }
    .flow li[data-state="failed"] > i::before { content: '✗'; color: var(--accent-2); }
    #flow-msg { margin: 4px 0 0; }
    #flow-msg.error { color: var(--accent-2); }

    /* 唯一呼吸点：流水中「进行中」步骤的圆点（部署时的心跳） */
    .flow li[data-state="active"] i { animation: pulse 1.8s ease-in-out infinite; }

    /* ===== 收尾「同框变身」（用户定稿 2）：完成 → 部署内容收束，本卡变为「已就绪」 ===== */
    #deploy-panel:not(.is-compact) #complete-cta { display: none; }
    #deploy-panel.is-compact #deploy-flow { display: none; }
    #deploy-panel .done-card { margin-top: 0; }

    /* ===== 状态 3：完成缩略卡（阶段框的收束形态） ===== */
    .done-card { text-align: center; margin-top: 14px; }
    .done-card .done-word { font-size: 20px; letter-spacing: 8px; color: var(--crt-bright); text-shadow: 0 0 26px rgba(109, 255, 184, 0.65); margin: 2px 0 10px; }
    .done-card #finish-note { margin: 0 0 14px; line-height: 1.8; }
    .done-card #finish-note .warn-text { display: block; color: #ffd9a8; }


    /* 诊断与日志（默认折叠；异常时渲染层自动展开 + 一行结论） */
    #logs-panel { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; }
    #logs-conclusion { margin: 0 0 6px; color: #ffd9a8; font-size: 12px; }
    #log { white-space: pre-wrap; }

    /* 右下常驻「跳过引导 ›」 */
    .skip { position: fixed; right: 18px; bottom: 14px; z-index: 2; font-size: 11px; color: #5f6675; text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; }
    .skip:hover { color: var(--muted); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

    /* hidden 语义兜底：任何作者 display 规则都不得让 [hidden] 元素显形（置末位保证同优先级胜出） */
    [hidden] { display: none; }

    /* ===== UX-2 补丁 4 · 窗口外框与滚动条（向导） ===== */
    /* A. 拖拽区：hero 品牌区可拖（移动窗口）；可点元素除外 */
    .hero { -webkit-app-region: drag; }
    .hero .badge, .hero button, .hero a { -webkit-app-region: no-drag; }
    .skip { -webkit-app-region: no-drag; }
    /* B. 滚动条主题化（与控制台同一契约：细、暗轨道、契约色 thumb、hover 微亮） */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(140, 255, 200, 0.20); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(140, 255, 200, 0.36); border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-corner { background: transparent; }
    /* C. 长页滚动稳定：gutter 预留，滚动条出现/消失不挤压内容 */
    html { scrollbar-gutter: stable; }
  </style>
</head>
<body class="setup is-idle">
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="stage" id="stage">
    <!-- ===== 品牌区（✦ / MEBULAR / 一句 tagline；部署中/完成时上浮至顶部） ===== -->
    <header class="hero">
      <div class="mark">✦</div>
      <h1>MEBULAR</h1>
      <p class="tagline" id="tagline">点一下，接入设备</p>
    </header>

    <!-- ===== 状态 1：初始（仅一个按钮，全部居中、无附加元素） ===== -->
    <div class="idle-cta" id="idle-cta">
      <button id="btn-go" class="primary big">开始部署</button>
    </div>

    <!-- ===== 状态 2：阶段框（点击后出现，四步进度 + 旁白；完成后同框「变身」为已就绪） ===== -->
    <section class="panel" id="deploy-panel" hidden>
      <div id="deploy-flow">
        <h2>开始部署 <span id="start-service-badge" class="badge service" hidden>临时运行</span></h2>
        <p class="muted" id="start-detail" hidden></p>
        <ol id="start-flow" class="flow">
          <li data-sub="launch" data-state="todo"><i></i>启动本机守护</li>
          <li data-sub="connect" data-state="todo"><i></i>接入 AI 助手（自动）</li>
        </ol>
        <p class="muted" id="flow-msg"></p>
        <div class="row" id="go-row" hidden>
          <button id="btn-resume" class="primary" hidden>从此处续跑</button>
        </div>
      </div>
      <!-- 完成态（用户定稿 2）：同框变身内容——不再另起卡、不再出现「已完成/已就绪」两个完成词 -->
      <div class="done-card" id="complete-cta" hidden>
        <p class="done-word">已就绪 ✦</p>
        <p class="muted" id="finish-note">之后想接更多助手、邀请其他设备，都在控制台里：<br />顶栏「＋ 邀请设备」随时可用。</p>
        <button id="btn-enter-console" class="primary big">进入控制台 ✦</button>
      </div>
    </section>

  </div>

  <details id="logs-panel" hidden>
    <summary>诊断与日志</summary>
    <p id="logs-conclusion" hidden></p>
    <p class="muted" id="logs-source">—</p>
    <div class="row">
      <button id="btn-logs">刷新日志</button>
      <button id="btn-logs-open" class="ghost">打开日志文件</button>
    </div>
    <pre id="log"></pre>
  </details>

  <button class="skip" id="btn-skip">跳过引导 ›</button>

  <script type="module" src="./wizard.js"></script>
</body>
</html>
