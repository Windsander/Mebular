<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Mebular one-machine-one-node topology">
  <defs>
    <style>
      .bg{fill:#0f172a}.card{fill:#111c33;stroke:#334155;stroke-width:1.5;rx:10}
      .daemon{fill:#122a4a;stroke:#3b82f6;stroke-width:1.8;rx:10}
      .app{fill:#132f28;stroke:#34d399;stroke-width:1.5;rx:8}
      .t{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;fill:#e2e8f0;font-size:14px}
      .h{font-size:16px;font-weight:700;fill:#ffffff}.s{font-size:12px;fill:#94a3b8}
      .l{stroke:#94a3b8;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lb{font-size:12px;fill:#cbd5e1}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="980" height="430"/>
  <text class="h" x="24" y="34">Mebular — one machine = one node = one daemon</text>
  <text class="s" x="24" y="54">The daemon is the sole holder of identity / network / trust; fleet and agents are local clients.</text>

  <!-- Machine A -->
  <rect class="card" x="24" y="80" width="400" height="300"/>
  <text class="t" x="44" y="106">Machine A</text>
  <rect class="daemon" x="44" y="120" width="360" height="120"/>
  <text class="t" x="60" y="146">Daemon (mebular serve)</text>
  <text class="s" x="60" y="168">identity (root | delegated cert chain) · domains (namespaces)</text>
  <text class="s" x="60" y="188">libp2p network · sync · trust / policy</text>
  <text class="s" x="60" y="208">local app API (loopback HTTP + token)</text>
  <text class="s" x="60" y="228">MCP /mcp (bearer) · join service (invite/issue cert)</text>

  <rect class="app" x="44" y="256" width="170" height="52"/>
  <text class="t" x="60" y="280">fleet (app #1)</text>
  <text class="s" x="60" y="298">tasks = tree · $MEBULAR_HOME/fleet.config.json</text>
  <rect class="app" x="234" y="256" width="170" height="52"/>
  <text class="t" x="250" y="280">Agents (MCP)</text>
  <text class="s" x="250" y="298">memory_* tools · shared store, split by domain</text>
  <path class="l" d="M129,256 L129,240"/><path class="l" d="M319,256 L319,240"/>

  <!-- Machine B -->
  <rect class="card" x="556" y="80" width="400" height="300"/>
  <text class="t" x="576" y="106">Machine B</text>
  <rect class="daemon" x="576" y="120" width="360" height="120"/>
  <text class="t" x="592" y="146">Daemon (mebular serve)</text>
  <text class="s" x="592" y="168">identity (delegated cert chain, no master key)</text>
  <text class="s" x="592" y="188">libp2p network · sync · trust / policy</text>
  <text class="s" x="592" y="208">local app API (loopback HTTP + token)</text>
  <text class="s" x="592" y="228">MCP /mcp (bearer) · join service</text>

  <rect class="app" x="576" y="256" width="170" height="52"/>
  <text class="t" x="592" y="280">fleet (app #1)</text>
  <text class="s" x="592" y="298">tasks = tree</text>
  <rect class="app" x="766" y="256" width="170" height="52"/>
  <text class="t" x="782" y="280">Agents (MCP)</text>
  <text class="s" x="782" y="298">memory_* tools</text>
  <path class="l" d="M661,256 L661,240"/><path class="l" d="M851,256 L851,240"/>

  <!-- sync between daemons -->
  <path class="l" d="M404,180 L556,180"/>
  <text class="lb" x="424" y="172">memory sync</text>
  <text class="lb" x="424" y="198">(libp2p / relay; default deny)</text>
  <text class="lb" x="424" y="216">grant ∪ membership ∩ subscription</text>

  <text class="s" x="24" y="408">Cross-device communication uses the memory (data) channel only — no general remote query/RPC. Same-machine agents are mutually trusted.</text>
</svg>
