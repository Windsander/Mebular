<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310" role="img" aria-label="桌面 App">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0d2140" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="980" height="310" fill="#03050a"/>
  <ellipse cx="490" cy="124" rx="539" ry="161.20000000000002" fill="url(#glow)"/>
  <text x="40" y="44" font-family="'SF Pro Display','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="21" fill="#e2ecff" font-weight="700" letter-spacing="1.2">桌面 App</text><text x="40" y="72" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#8aa8c8">从安装到锁定、可用的控制台。</text><rect x="30" y="92" width="270" height="154" rx="14" fill="#081322" stroke="#1a3a60" stroke-width="1.2"/><circle cx="64" cy="122" r="16" fill="#0d1e35" stroke="#4a8acf" stroke-width="1.2"/><text x="64" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#8ac8ff" font-weight="700" text-anchor="middle">1</text><text x="92" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e2ecff" font-weight="700">开始部署</text><text x="58" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">启动本机服务，</text><text x="58" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">接入这台机器上</text><text x="58" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">已装好的助手。</text><rect x="355" y="92" width="270" height="154" rx="14" fill="#081322" stroke="#1a3a60" stroke-width="1.2"/><circle cx="389" cy="122" r="16" fill="#0d1e35" stroke="#4a8acf" stroke-width="1.2"/><text x="389" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#8ac8ff" font-weight="700" text-anchor="middle">2</text><text x="417" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e2ecff" font-weight="700">新建或加入忆云</text><text x="383" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">第一台设备填忆云名；</text><text x="383" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">后续设备粘贴</text><text x="383" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">一次性令牌。</text><rect x="680" y="92" width="270" height="154" rx="14" fill="#081322" stroke="#1a3a60" stroke-width="1.2"/><circle cx="714" cy="122" r="16" fill="#0d1e35" stroke="#4a8acf" stroke-width="1.2"/><text x="714" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#8ac8ff" font-weight="700" text-anchor="middle">3</text><text x="742" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#e2ecff" font-weight="700">邀请下一台设备</text><text x="708" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">在顶栏点「邀请设备」，</text><text x="708" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">把令牌交给</text><text x="708" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8">下一台机器。</text><path d="M300,168 L345,168" stroke="#4a8acf" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M340,164 L347,168 L340,172" fill="#4a8acf"/><path d="M625,168 L670,168" stroke="#4a8acf" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M665,164 L672,168 L665,172" fill="#4a8acf"/><text x="490" y="278" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#8aa8c8" text-anchor="middle">v0.2.1 · macOS Universal、Windows x64、Linux x64</text><text x="490" y="296" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6f93b6" text-anchor="middle">未签名发布；签名与公证留待后续版本。</text>
</svg>