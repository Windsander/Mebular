  <text x="40" y="44" font-family="'SF Pro Display','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="21" fill="#0b1a33" font-weight="700" letter-spacing="1.2">DESKTOP APP</text><text x="40" y="72" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#5a7290">From install to a locked, ready console.</text><rect x="30" y="92" width="270" height="154" rx="14" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/><circle cx="64" cy="122" r="16" fill="#ffffff" stroke="#7fa6d9" stroke-width="1.2"/><text x="64" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#2f6fce" font-weight="700" text-anchor="middle">1</text><text x="92" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700">Start deployment</text><text x="58" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">Starts the local service</text><text x="58" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">and connects your</text><text x="58" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">installed assistants.</text><rect x="355" y="92" width="270" height="154" rx="14" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/><circle cx="389" cy="122" r="16" fill="#ffffff" stroke="#7fa6d9" stroke-width="1.2"/><text x="389" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#2f6fce" font-weight="700" text-anchor="middle">2</text><text x="417" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700">Create or join a Cloud</text><text x="383" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">Name it on the first device.</text><text x="383" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">Paste a one-time token</text><text x="383" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">on later ones.</text><rect x="680" y="92" width="270" height="154" rx="14" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/><circle cx="714" cy="122" r="16" fill="#ffffff" stroke="#7fa6d9" stroke-width="1.2"/><text x="714" y="127" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="14" fill="#2f6fce" font-weight="700" text-anchor="middle">3</text><text x="742" y="128" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700">Invite the next device</text><text x="708" y="158" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">Open Invite device in the</text><text x="708" y="178" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">top bar and hand the</text><text x="708" y="198" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290">token to the next machine.</text><path d="M300,168 L345,168" stroke="#7fa6d9" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M340,164 L347,168 L340,172" fill="#7fa6d9"/><path d="M625,168 L670,168" stroke="#7fa6d9" stroke-width="1.3" stroke-dasharray="4 5" fill="none"/><path d="M665,164 L672,168 L665,172" fill="#7fa6d9"/><text x="490" y="278" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" text-anchor="middle">v0.1.2 · macOS Universal, Windows x64, Linux x64</text><text x="490" y="296" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" text-anchor="middle">Unsigned release; signing and notarization follow.</text>
