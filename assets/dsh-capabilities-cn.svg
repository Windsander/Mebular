    <text x="40" y="72" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#8aa8c8" font-weight="400" text-anchor="start">一套 Console、官方 MCP 工具、状态、生命周期与按需安装更新。</text>
    <rect x="40" y="100" width="320" height="150" rx="16" fill="#081322" stroke="#1a3a60" stroke-width="1.2"/>
