    <text x="740" y="188" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11.5" fill="#8ac8ff" font-weight="400" text-anchor="start">绿 / 琥珀 / 红 / 灰</text>
