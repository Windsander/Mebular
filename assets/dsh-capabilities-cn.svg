<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="DSH 里得到什么：侧边栏共享 Console、官方 MCP 工具、状态点、attach / managed / auto 生命周期与按需安装更新。">
  <title>能力</title>
  <desc>DSH 里得到什么：侧边栏共享 Console、官方 MCP 工具、状态点、attach / managed / auto 生命周期与按需安装更新。</desc>
  <defs>
    <style>
      .theme-light { display: none; }
      @media (prefers-color-scheme: light) {
        .theme-dark { display: none; }
        .theme-light { display: block; }
      }
    </style>
  </defs>
  <g class="theme-dark">
