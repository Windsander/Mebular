  <text x="766" y="180" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290" font-weight="400">侧边栏 iframe</text>
  <text x="766" y="200" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290" font-weight="400">官方 MCP client</text>
