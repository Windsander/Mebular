  <path d="M384,142 l10,-4 v8 z" fill="#7fa6d9"/>
  <circle cx="700" cy="142" r="2.5" fill="#2f6fce"/>
  <line x1="700" y1="202" x2="384" y2="202" stroke="#7fa6d9" stroke-width="1.3" stroke-dasharray="4 5"/>
  <path d="M384,202 l10,-4 v8 z" fill="#7fa6d9"/>
  <circle cx="700" cy="202" r="2.5" fill="#2f6fce"/>
  <text x="540" y="128" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#2f6fce" font-weight="500" text-anchor="middle">iframe · ?embed=dsh</text>
  <text x="540" y="188" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#2f6fce" font-weight="500" text-anchor="middle">官方 MCP client · /mcp</text>
  <text x="540" y="170" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#5a7290" font-weight="400" text-anchor="middle">同一个守护</text>

  <text x="540" y="282" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#5a7290" font-weight="400" text-anchor="middle">发现顺序：daemonUrl &gt; MEBULAR_HTTP_PORT &gt; runtime.json &gt; 7331</text>
