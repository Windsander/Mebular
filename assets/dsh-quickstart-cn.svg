    <circle cx="312" cy="128" r="12" fill="#2f6fce" opacity="0.16"/>
    <text x="312" y="133" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#2f6fce" font-weight="700" text-anchor="middle">1</text>
    <text x="122" y="142" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700" text-anchor="start">安装插件</text>
    <text x="60" y="188" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11.5" fill="#2f6fce" font-weight="400" text-anchor="start">dsh plugin --profile web add</text>
    <text x="60" y="210" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" font-weight="400" text-anchor="start">@mebular/dsh-plugin@0.2.2</text>
    <rect x="390" y="100" width="300" height="160" rx="16" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/>
    <path d="M433,123 L452,133 L452,150 L433,160 L414,150 L414,133 Z" fill="#ffffff" stroke="#7fa6d9" stroke-width="1.2"/><path d="M414,133 L433,143 L452,133" fill="none" stroke="#2f6fce" stroke-width="1.2" opacity="0.8"/><line x1="433" y1="143" x2="433" y2="158" stroke="#2f6fce" stroke-width="1.2" opacity="0.5"/>
    <circle cx="662" cy="128" r="12" fill="#2f6fce" opacity="0.16"/>
    <text x="662" y="133" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#2f6fce" font-weight="700" text-anchor="middle">2</text>
    <text x="472" y="142" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700" text-anchor="start">重启 DSH</text>
    <text x="410" y="188" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11.5" fill="#2f6fce" font-weight="400" text-anchor="start">open Mebular panel</text>
    <text x="410" y="210" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" font-weight="400" text-anchor="start">自动解析 shared runtime</text>
    <rect x="740" y="100" width="300" height="160" rx="16" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/>
    <path d="M783,125 A14,14 0 1 1 771,132" fill="none" stroke="#2f6fce" stroke-width="1.8"/><path d="M771,132 L771,125 L778,125" fill="none" stroke="#2f6fce" stroke-width="1.8"/><circle cx="783" cy="139" r="3" fill="#2f6fce"/>
    <circle cx="1012" cy="128" r="12" fill="#2f6fce" opacity="0.16"/>
    <text x="1012" y="133" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11" fill="#2f6fce" font-weight="700" text-anchor="middle">3</text>
    <text x="822" y="142" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#0b1a33" font-weight="700" text-anchor="start">App 或面板</text>
    <text x="760" y="188" font-family="'SF Mono','Cascadia Code','Source Code Pro',Consolas,monospace" font-size="11.5" fill="#2f6fce" font-weight="400" text-anchor="start">App/CLI → attach</text>
    <text x="760" y="210" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" font-weight="400" text-anchor="start">无 runtime → 面板安装</text>
    <line x1="345" y1="180" x2="380" y2="180" stroke="#7fa6d9" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#arrow-light)"/>
    <line x1="695" y1="180" x2="730" y2="180" stroke="#7fa6d9" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7" marker-end="url(#arrow-light)"/>
    <text x="540" y="288" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" font-weight="400" text-anchor="middle">不会静默下载；用户确认后才安装</text>
  </g>
</svg>
