<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="140" viewBox="0 0 1080 140" role="img" aria-label="状态点：绿色已连接，琥珀色启动/安装/更新中，红色未运行，灰色等待首次检查。">
  <title>状态点</title>
  <desc>状态点：绿色已连接，琥珀色启动/安装/更新中，红色未运行，灰色等待首次检查。</desc>
  <defs>
    <style>
      .theme-light { display: none; }
      @media (prefers-color-scheme: light) {
        .theme-dark { display: none; }
        .theme-light { display: block; }
      }
    </style>
  </defs>
  <g class="theme-dark">
    <rect width="1080" height="140" fill="#03050a"/>
    <defs><radialGradient id="glow-theme-dark" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#0d2140" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient></defs>
    <ellipse cx="540" cy="73" rx="620" ry="77" fill="url(#glow-theme-dark)"/>
    <text x="40" y="44" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="21" fill="#e2ecff" font-weight="700" text-anchor="start" letter-spacing="1.2">状态点</text>
    <text x="40" y="72" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#8aa8c8" font-weight="400" text-anchor="start">侧边栏图标；面板关闭也可见</text>
    <circle cx="60" cy="98" r="15" fill="#3fb950" opacity="0.16"/>
    <circle cx="60" cy="98" r="7" fill="#3fb950"/>
    <text x="82" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e2ecff" font-weight="400" text-anchor="start">已连接</text>
    <circle cx="300" cy="98" r="15" fill="#d29922" opacity="0.16"/>
    <circle cx="300" cy="98" r="7" fill="#d29922"/>
    <text x="322" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e2ecff" font-weight="400" text-anchor="start">启动 / 安装 / 更新</text>
    <circle cx="540" cy="98" r="15" fill="#f85149" opacity="0.16"/>
    <circle cx="540" cy="98" r="7" fill="#f85149"/>
    <text x="562" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e2ecff" font-weight="400" text-anchor="start">未运行</text>
    <circle cx="780" cy="98" r="15" fill="#8b949e" opacity="0.16"/>
