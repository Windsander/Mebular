    <circle cx="300" cy="98" r="15" fill="#9a6700" opacity="0.16"/>
    <circle cx="300" cy="98" r="7" fill="#9a6700"/>
    <text x="322" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#0b1a33" font-weight="400" text-anchor="start">启动 / 安装 / 更新</text>
    <circle cx="540" cy="98" r="15" fill="#cf222e" opacity="0.16"/>
    <circle cx="540" cy="98" r="7" fill="#cf222e"/>
    <text x="562" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#0b1a33" font-weight="400" text-anchor="start">未运行</text>
    <circle cx="780" cy="98" r="15" fill="#6e7781" opacity="0.16"/>
    <circle cx="780" cy="98" r="7" fill="#6e7781"/>
    <text x="802" y="103" font-family="'SF Pro Text','PingFang SC','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#0b1a33" font-weight="400" text-anchor="start">待检查</text>
