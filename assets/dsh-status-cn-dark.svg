  </g>
  <g class="theme-light">
    <rect width="1080" height="140" fill="#ffffff"/>
    <defs><radialGradient id="glow-theme-light" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#dceaff" stop-opacity="0.7"/>
