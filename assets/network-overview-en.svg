,204" fill="#4a8acf"/><text x="540" y="187" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#8ac8ff" text-anchor="middle">peer-to-peer</text><text x="540" y="218" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#8aa8c8" text-anchor="middle">offline-first</text><rect x="40" y="304" width="1000" height="58" rx="12" fill="#0a1628" stroke="#1a3a60" stroke-width="1.2"/><text x="60" y="330" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#e2ecff">Each machine runs one node; nodes sync memory and tasks directly.</text><text x="60" y="350" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#e2ecff">Add a device with one QR code or token — the master key stays on the root machine.</text><rect x="40" y="376" width="230" height="36" rx="18" fill="#0d1e35" stroke="#264c79" stroke-width="1.2"/><text x="155" y="399" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8ac8ff" text-anchor="middle">Context follows</text><rect x="290" y="376" width="230" height="36" rx="18" fill="#0d1e35" stroke="#264c79" stroke-width="1.2"/><text x="405" y="399" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8" text-anchor="middle">Work moves</text><rect x="540" y="376" width="230" height="36" rx="18" fill="#0d1e35" stroke="#264c79" stroke-width="1.2"/><text x="655" y="399" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8" text-anchor="middle">History checks</text><rect x="790" y="376" width="230" height="36" rx="18" fill="#0d1e35" stroke="#264c79" stroke-width="1.2"/><text x="905" y="399" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8aa8c8" text-anchor="middle">Memory travels</text><text x="540" y="446" font-famil