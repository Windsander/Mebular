<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-label="ONE GRAPH, NOT ANOTHER SILO">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#dceaff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="430" fill="#ffffff"/>
  <ellipse cx="540" cy="172" rx="594" ry="223.6" fill="url(#glow)"/>
  <text x="40" y="44" font-family="'SF Pro Display','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="21" fill="#0b1a33" font-weight="700" letter-spacing="1.2">ONE GRAPH, NOT ANOTHER SILO</text><text x="40" y="72" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#5a7290">One shared memory for every assistant and device.</text><rect x="40" y="104" width="460" height="190" rx="16" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/><text x="64" y="134" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#5a7290" font-weight="700">The usual setup</text><circle cx="68" cy="171" r="3" fill="#5a7290"/><text x="82" y="176" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">Context stays in one assistant or machine.</text><circle cx="68" cy="213" r="3" fill="#5a7290"/><text x="82" y="218" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">Sync needs an account and a hosted service.</text><circle cx="68" cy="255" r="3" fill="#5a7290"/><text x="82" y="260" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">You cannot tell who changed what.</text><rect x="580" y="104" width="460" height="190" rx="16" fill="#f7faff" stroke="#c9d8ee" stroke-width="1.2"/><text x="604" y="134" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#2f6fce" font-weight="700">Mebular</text><circle cx="608" cy="171" r="3" fill="#2f6fce"/><text x="622" y="176" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">Every connected assistant reads the same graph.</text><circle cx="608" cy="213" r="3" fill="#2f6fce"/><text x="622" y="218" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">Devices sync directly, no hosted account.</text><circle cx="608" cy="255" r="3" fill="#2f6fce"/><text x="622" y="260" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#0b1a33">Signed writes and auditable history.</text><path d="M510,199 L556,199" stroke="#7fa6d9" stroke-width="1.4" stroke-dasharray="4 5" fill="none"/><path d="M552,194 L560,199 L552,204" fill="#7fa6d9"/><rect x="40" y="346" width="230" height="36" rx="18" fill="#ffffff" stroke="#c9d8ee" stroke-width="1.2"/><text x="155" y="369" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2f6fce" text-anchor="middle">Local-first</text><rect x="290" y="346" width="230" height="36" rx="18" fill="#ffffff" stroke="#c9d8ee" stroke-width="1.2"/><text x="405" y="369" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290" text-anchor="middle">Direct sync</text><rect x="540" y="346" width="230" height="36" rx="18" fill="#ffffff" stroke="#c9d8ee" stroke-width="1.2"/><text x="655" y="369" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290" text-anchor="middle">Auditable</text><rect x="790" y="346" width="230" height="36" rx="18" fill="#ffffff" stroke="#c9d8ee" stroke-width="1.2"/><text x="905" y="369" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5a7290" text-anchor="middle">MCP</text><text x="540" y="408" font-family="'SF Pro Text','Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#5a7290" text-anchor="middle">A Cloud is one shared memory space in the network — not a hosted service.</text>
</svg>