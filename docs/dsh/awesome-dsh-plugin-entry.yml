description:
  en: "Bring Mebular to DSH: local-first cross-device memory and task collaboration. One graph shared with your other AI assistants, synced peer-to-peer, with signed, auditable writes; Mebular's Console sits in the DSH sidebar. The Mebular App bundles the runtime, so the plugin attaches directly; with the plugin alone, click Install in the panel and it automatically downloads, verifies, initializes and starts one — no silent install."
  zh: '为 DSH 接入 Mebular：本地优先的跨设备记忆与任务协作。一张与其它 AI 助手共用、点对点同步的图，写入即签名、可审计；Mebular Console 直接嵌入 DSH 侧边栏。Mebular App 自带 runtime，插件直接连接；只装插件时，可在面板内点击安装，自动完成下载、校验、初始化与启动，不会静默安装。'
