<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mebular · 分布式存储的跨广域网记忆系统</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, 'Apple LiGothic', 'Noto Sans CJK SC', sans-serif; background: #05050a; color: #e0e0e0; }
    .hero { padding: 60px 20px 40px; text-align: center; position: relative; }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 3.5rem); margin: 0 0 12px; letter-spacing: 0.3em; }
    .hero p { font-size: clamp(1rem, 2.5vw, 1.2rem); max-width: 720px; margin: 0 auto 40px; line-height: 1.6; opacity: 0.8; }
    .hero .nebula-hint { font-size: 0.75rem; opacity: 0.5; margin-top: 20px; }
    nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(5,5,10,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); padding: 12px 24px; }
    nav a { margin-left: 24px; color: #a0a0ff; text-decoration: none; font-size: 0.85rem; }
    nav a:hover { color: #c0c0ff; }
    .nav-scrolled { background: rgba(5,5,10,0.5); transition: background 0.3s; }
    .content { max-width: 860px; margin: 120px auto 40px; padding: 0 20px; }
    .card { background: rgba(255,255,255,0.03); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 32px 24px; margin: 24px 0; }
    .card h2 { font-size: 1.3rem; margin: 0 0 16px; letter-spacing: 0.15em; }
    .card p { line-height: 1.8; opacity: 0.8; }
    .section { margin: 80px 0; }
    .node-area { position: relative; min-height: 300px; background: rgba(5,5,20,0.6); border-radius 12px; margin: 32px 0; }
    .node-area canvas { display: block; width: 100%; height: 100%; border-radius: 10px; }
    footer { padding: 32px 20px; text-align: center; font-size: 0.8rem; opacity: 0.5; }
    footer a { color: #6ab0ff; text-decoration: none; }
    footer a:hover { color: #8ac8ff; }
    .scroll-hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); animation: bounce 2s infinite; font-size: 0.7rem; opacity: 0.4; }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-8px); } 60% { transform: translateX(-50%) translateY(-4px); } }
    .controls { position: fixed; top: 80px; right: 24px; }
    .controls button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e0e0e0; padding: 8px 12px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; backdrop-filter: blur(5px); }
    .controls button:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <!-- Nebula canvas -->
  <canvas id="nebula" style="display:block; width:100%; height:100%;"></canvas>

  <div class="hero">
    <h1>Mebular</h1>
    <p>分布式存储的跨广域网记忆系统</p>
    <div class="nebula-hint">星云背景由自适应噪声、有机核心与分层视差渲染</div>
  </div>

  <nav>
    <a href="#about">关于</a>
    <a href="#features">特性</a>
    <a href="#contact">联系</a>
  </nav>

  <div class="content">
    <div class="card">
      <h2>系统概览</h2>
      <p>Mebular 是一个基于分布式存储的跨广域网记忆系统，旨在通过关联性图记忆组织跨域知识，同时提供安全、本地化的数据设计。项目设计文档保留本地，不提交远端。</p>
    </div>

    <div class="card">
      <h2>背景渲染技术</h2>
      <p>nebula.js 使用 Canvas 2D 实现真实星云背景：各向异性噪声丝状结构、尘埃吸收带、连续色温场（HSV 梯度）、有机核心辉光、四层视差（体积云→核心→星星→粒子），并配有鼠标视差与独立星星时漂移。</p>
    </div>
  </div>

  <footer>
    <p>Mebular · <a href="https://github.com/Windsander/Mebular">GitHub</a> · MIT 协议</p>
  </footer>

  <div class="scroll-hint">滚动查看更多</div>

  <div class="controls">
    <button id="resetBtn">重置背景</button>
  </div>

  <script src="nebula.js"></script>
  <script>
    // 初始化：在页面加载后确保 canvas 已准备就绪
    document.addEventListener('DOMContentLoaded', function() {
      // 调用 nebula.js 的自动初始化
      // 如果需要额外控制，可在此处添加
    });

    // 重置背景按钮
    document.getElementById('resetBtn').addEventListener('click', function() {
      // 重新 seedStars 和 seedParticles，重置视图
      if (window.nebulaReset) {
        window.nebulaReset();
      } else {
        location.reload();
      }
    });
  </script>
</body>
</html>
